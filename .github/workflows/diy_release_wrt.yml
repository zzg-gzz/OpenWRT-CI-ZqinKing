# 仅根据“diy_build_wrt.yml”编译结果发布固件。
# 只需要找到这次 Build 的 Run ID，重新运行 DIY Release WRT，输入这个 Run ID，它会直接取已经编译好的固件，不会再次运行 ./build.sh。
#  Run ID 从查看结束的工作流的URL中可以找到。
# 注意 Verify Build Workflow这一步中，BUILD_WORKFLOW_FILE="diy_build_wrt.yml"（上一个工作流文件名） 需根据实际情况更改

name: DIY Release WRT

on:
  workflow_run:
    workflows:
      -  DIY Build WRT
    types:
      - completed

  workflow_dispatch:
    inputs:
      run_id:
        description: "Build Workflow Run ID"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Release WRT
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Set Build Run ID
        id: build_run
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            BUILD_RUN_ID="${{ github.event.workflow_run.id }}"
          else
            BUILD_RUN_ID="${{ inputs.run_id }}"
          fi

          if ! [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid Build Run ID: $BUILD_RUN_ID"
            exit 1
          fi

          echo "Build Run ID: $BUILD_RUN_ID"

          echo "build_run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Verify Build Workflow
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.build_run.outputs.build_run_id }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_WORKFLOW_FILE="diy_build_wrt.yml"

          echo "========================================"
          echo "Verify Build Workflow"
          echo "Build Run ID: $BUILD_RUN_ID"
          echo "Build Workflow: $BUILD_WORKFLOW_FILE"
          echo "========================================"

          # 获取 Build Workflow ID
          BUILD_WORKFLOW_ID=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/${BUILD_WORKFLOW_FILE}" \
            --jq '.id')

          if [ -z "$BUILD_WORKFLOW_ID" ] || [ "$BUILD_WORKFLOW_ID" = "null" ]; then
            echo "ERROR: Cannot find $BUILD_WORKFLOW_FILE"
            exit 1
          fi

          # 获取指定 Run 的信息
          RUN_INFO=$(gh api \
            "/repos/${{ github.repository }}/actions/runs/${BUILD_RUN_ID}")

          RUN_WORKFLOW_ID=$(echo "$RUN_INFO" | jq -r '.workflow_id')
          RUN_STATUS=$(echo "$RUN_INFO" | jq -r '.status')
          RUN_CONCLUSION=$(echo "$RUN_INFO" | jq -r '.conclusion')
          RUN_BRANCH=$(echo "$RUN_INFO" | jq -r '.head_branch')
          RUN_SHA=$(echo "$RUN_INFO" | jq -r '.head_sha')
          RUN_NAME=$(echo "$RUN_INFO" | jq -r '.name')

          echo "Workflow Name:   $RUN_NAME"
          echo "Workflow ID:     $RUN_WORKFLOW_ID"
          echo "Expected ID:     $BUILD_WORKFLOW_ID"
          echo "Status:          $RUN_STATUS"
          echo "Conclusion:      $RUN_CONCLUSION"
          echo "Branch:          $RUN_BRANCH"
          echo "Commit SHA:      $RUN_SHA"

          # 确认 Run 属于 diy_build_wrt.yml
          if [ "$RUN_WORKFLOW_ID" != "$BUILD_WORKFLOW_ID" ]; then
            echo "ERROR: The specified Run ID is not from $BUILD_WORKFLOW_FILE."
            exit 1
          fi

          # 确认 Build 已完成
          if [ "$RUN_STATUS" != "completed" ]; then
            echo "ERROR: Build Workflow is not completed."
            exit 1
          fi

          # 确认 Build 成功
          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "ERROR: Build Workflow failed."
            exit 1
          fi

          echo "Build Workflow verification successful."

          echo "build_branch=$RUN_BRANCH" >> "$GITHUB_OUTPUT"
          echo "build_sha=$RUN_SHA" >> "$GITHUB_OUTPUT"

      - name: Download Build Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.build_run.outputs.build_run_id }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          echo "Downloading artifacts from Build Run $BUILD_RUN_ID..."

          gh run download "$BUILD_RUN_ID" \
            --repo "${{ github.repository }}" \
            --dir artifacts

          echo "========================================"
          echo "Downloaded files:"
          echo "========================================"

          find artifacts -type f -print

      - name: Prepare Release Files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          echo "Searching firmware files..."

          find artifacts -type f \
            \( \
              -name "*.bin" \
              -o -name "*.manifest" \
              -o -name "*.img" \
              -o -name "*.itb" \
              -o -name "*.gz" \
              -o -name "*.xz" \
              -o -name "*.zip" \
            \) \
            -exec cp -v {} release/ \;

          echo "========================================"
          echo "Release files:"
          echo "========================================"

          ls -lh release

          if [ -z "$(find release -type f -print -quit)" ]; then
            echo "ERROR: No firmware files found."
            exit 1
          fi

      - name: Create Release Information
        id: release_info
        shell: bash
        run: |
          set -euo pipefail

          BUILD_RUN_ID="${{ steps.build_run.outputs.build_run_id }}"
          BUILD_SHA="${{ steps.verify.outputs.build_sha }}"

          VERSION=$(date -u '+%Y.%m.%d-%H%M')

          TAG_NAME="v${VERSION}-run${BUILD_RUN_ID}"

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          cat > release_notes.md << EOF
          ## ImmortalWRT Firmware

          - Build Run ID: ${BUILD_RUN_ID}
          - Build Workflow: diy_build_wrt.yml
          - Branch: ${{ steps.verify.outputs.build_branch }}
          - Commit: ${BUILD_SHA}

          Firmware generated by GitHub Actions.
          EOF

          echo "Release tag: $TAG_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: WRT ${{ steps.release_info.outputs.tag_name }}
          body_path: release_notes.md
          files: release/*
          generate_release_notes: false
