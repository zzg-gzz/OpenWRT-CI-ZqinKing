# 仅根据“diy_build_wrt.yml”编译结果发布固件。
# 只需要找到这次 Build 的 Run ID，重新运行 DIY Release WRT，输入这个 Run ID，它会直接取已经编译好的固件，不会再次运行 ./build.sh。

name: DIY Release WRT

run-name: Release - ${{ inputs.run_id || github.event.workflow_run.id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        description: Build Workflow Run ID
        type: string

  workflow_run:
    workflows:
      - DIY Build WRT
    types:
      - completed

permissions:
  actions: read
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Determine Build Run ID
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            BUILD_RUN_ID="${{ inputs.run_id }}"
          else
            BUILD_RUN_ID="${{ github.event.workflow_run.id }}"
          fi

          if ! [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid Build Run ID: $BUILD_RUN_ID"
            exit 1
          fi

          echo "BUILD_RUN_ID=$BUILD_RUN_ID" >> "$GITHUB_ENV"

          echo "Build Run ID: $BUILD_RUN_ID"

      - name: Verify Build Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          RUN_INFO=$(gh run view "$BUILD_RUN_ID" \
            --json name,status,conclusion,headBranch,headSha,createdAt,updatedAt)

          echo "$RUN_INFO"

          WORKFLOW_NAME=$(echo "$RUN_INFO" | jq -r '.name')
          CONCLUSION=$(echo "$RUN_INFO" | jq -r '.conclusion')

          if [ "$WORKFLOW_NAME" != "DIY Build WRT" ]; then
            echo "ERROR: The specified Run ID is not from DIY Build WRT."
            exit 1
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "ERROR: Build workflow did not complete successfully."
            echo "Conclusion: $CONCLUSION"
            exit 1
          fi

      - name: Download Firmware Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          rm -rf ./downloaded_firmware

          mkdir -p ./downloaded_firmware

          ARTIFACT_NAME="wrt-firmware-${BUILD_RUN_ID}"

          echo "Downloading Artifact:"
          echo "$ARTIFACT_NAME"

          gh run download "$BUILD_RUN_ID" \
            --name "$ARTIFACT_NAME" \
            --dir ./downloaded_firmware

          echo "================ Firmware Artifact ================"

          find ./downloaded_firmware -type f | sort

          echo "===================================================="

          if ! find ./downloaded_firmware -type f | grep -q .; then
            echo "ERROR: Firmware Artifact is empty."
            exit 1
          fi

      - name: Download Metadata Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          rm -rf ./downloaded_metadata

          mkdir -p ./downloaded_metadata

          ARTIFACT_NAME="wrt-metadata-${BUILD_RUN_ID}"

          echo "Downloading Artifact:"
          echo "$ARTIFACT_NAME"

          if gh run download "$BUILD_RUN_ID" \
            --name "$ARTIFACT_NAME" \
            --dir ./downloaded_metadata; then

            echo "Metadata Artifact downloaded."

          else

            echo "WARNING: Metadata Artifact is unavailable."
            echo "Release will continue using firmware files."

          fi

      - name: Load Build Metadata
        run: |
          set -e

          INFO_FILE="./downloaded_metadata/build-info.env"

          if [ -f "$INFO_FILE" ]; then

            echo "================ Build Metadata ================"

            cat "$INFO_FILE"

            echo "================================================="

            set -a
            source "$INFO_FILE"
            set +a

            echo "MODEL=$MODEL" >> "$GITHUB_ENV"
            echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
            echo "BUILD_SRC=$BUILD_SRC" >> "$GITHUB_ENV"
            echo "KVER=$KVER" >> "$GITHUB_ENV"

          else

            echo "Metadata not found."

            echo "MODEL=unknown" >> "$GITHUB_ENV"
            echo "BUILD_DATE=$(date +"%y.%m.%d_%H.%M.%S")" >> "$GITHUB_ENV"
            echo "BUILD_SRC=unknown" >> "$GITHUB_ENV"
            echo "KVER=unknown" >> "$GITHUB_ENV"

          fi

      - name: Prepare Firmware Directory
        run: |
          set -e

          rm -rf ./firmware

          mkdir -p ./firmware

          cp -a ./downloaded_firmware/. ./firmware/

          echo "================ Firmware Files ================"

          find ./firmware -maxdepth 1 -type f -print | sort

          echo "================================================="

          if ! find ./firmware -maxdepth 1 -type f | grep -q .; then
            echo "ERROR: No firmware files found."
            exit 1
          fi

      - name: Prepare Kmod Directory
        run: |
          set -e

          rm -rf ./action_build

          mkdir -p ./action_build/bin

          echo "Kmod directory prepared."

      - name: Package Kmods
        run: |
          set -e

          if [ ! -d "./action_build/bin" ]; then
            echo "ERROR: kmod source directory not found."
            exit 1
          fi

          KMOD_LIST=$(mktemp)

          trap 'rm -f "$KMOD_LIST"' EXIT

          (
            cd ./action_build/bin

            find . -type f \
              \( -name "kmod*.ipk" -o -name "kmod*.apk" \) \
              -print |
              sort > "$KMOD_LIST"
          )

          if [ ! -s "$KMOD_LIST" ]; then
            echo "WARNING: No kmod packages were included in the firmware Artifact."

            echo "KMOD_ARCHIVE=" >> "$GITHUB_ENV"

            exit 0
          fi

          KMOD_COUNT=$(wc -l < "$KMOD_LIST" | tr -d '[:space:]')

          ARCHIVE_NAME="kmods_${MODEL}_${KVER:-unknown-kernel}_${BUILD_DATE}.tar.gz"

          tar \
            -C ./action_build/bin \
            -czf "$ARCHIVE_NAME" \
            -T "$KMOD_LIST"

          echo "KMOD_ARCHIVE=$ARCHIVE_NAME" >> "$GITHUB_ENV"

          echo "Packaged $KMOD_COUNT kmod packages."

      - name: Package OpenWrt Firmware
        if: ${{ env.MODEL == 'n1_immwrt' }}
        uses: unifreq/openwrt_packit@8007d3efd49bb42aa20c5755a50af21dc7a438e1
        env:
          OPENWRT_ARMVIRT: firmware/*.tar.gz
          PACKAGE_SOC: s905d
          KERNEL_VERSION_NAME: 6.6.y
          WHOAMI: ZqinKing

      - name: Prepare Release Body
        run: |
          set -e

          if [ -f "./downloaded_metadata/release_body.txt" ]; then

            cp "./downloaded_metadata/release_body.txt" ./release_body.txt

          else

            echo "云编译发布" > release_body.txt
            echo "源码：${BUILD_SRC}" >> release_body.txt
            echo "Kernel: ${KVER}" >> release_body.txt
            echo "WIFI密码: 12345678" >> release_body.txt
            echo "LAN地址: 192.168.1.1" >> release_body.txt

            if [ -n "${KMOD_ARCHIVE:-}" ]; then
              echo "KMOD归档: ${KMOD_ARCHIVE}" >> release_body.txt
            fi

            echo "插件：" >> release_body.txt

            MANIFEST=$(find ./firmware \
              -maxdepth 1 \
              -type f \
              -name "*.manifest" |
              head -n 1)

            if [ -n "$MANIFEST" ]; then
              grep -oP "luci-app(-[a-zA-Z0-9]{1,}){1,}" "$MANIFEST" |
                awk -F":" '{print $NF}' >> release_body.txt || true
            fi

          fi

          if [ -n "${KMOD_ARCHIVE:-}" ]; then
            echo "KMOD归档: ${KMOD_ARCHIVE}" >> release_body.txt
          fi

          echo "================ Release Body ================"

          cat release_body.txt

          echo "==============================================="

      - name: Determine Release Files
        run: |
          set -e

          rm -f ./release_files.txt

          if [ "$MODEL" = "n1_immwrt" ] &&
             [ -n "${PACKAGED_OUTPUTPATH:-}" ] &&
             [ -d "$PACKAGED_OUTPUTPATH" ]; then

            echo "Using N1 packaged output:"
            echo "$PACKAGED_OUTPUTPATH"

            find "$PACKAGED_OUTPUTPATH" \
              -maxdepth 1 \
              -type f \
              -print >> release_files.txt

          else

            find ./firmware \
              -maxdepth 1 \
              -type f \
              -print >> release_files.txt

          fi

          if [ -n "${KMOD_ARCHIVE:-}" ] &&
             [ -f "./${KMOD_ARCHIVE}" ]; then

            echo "./${KMOD_ARCHIVE}" >> release_files.txt

          fi

          echo "================ Release Files ================"

          cat release_files.txt

          echo "================================================"

          if [ ! -s release_files.txt ]; then
            echo "ERROR: Release file list is empty."
            exit 1
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ env.BUILD_DATE }}_${{ env.MODEL }}
          files: |
            ${{ env.MODEL == 'n1_immwrt' && env.PACKAGED_OUTPUTPATH || './firmware' }}/*.*
            ./kmods_*.tar.gz
          fail_on_unmatched_files: false
          body_path: ./release_body.txt

      - name: Release Summary
        run: |
          {
            echo "## OpenWrt Release Completed"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Model | \`${MODEL}\` |"
            echo "| Build Date | \`${BUILD_DATE}\` |"
            echo "| Kernel | \`${KVER}\` |"
            echo "| Build Run ID | \`${BUILD_RUN_ID}\` |"
            echo "| Source | \`${BUILD_SRC}\` |"
            echo "| Release Tag | \`${BUILD_DATE}_${MODEL}\` |"
            echo
            echo "Firmware was released without rebuilding OpenWrt."
          } >> "$GITHUB_STEP_SUMMARY"
