name: DIY Build WRT
# Code by ChatGPT  本工作流编译固件并Upload Build Artifact，如果本工作流编译成功可以继续执行发布固件的工作流。
# 拆分是为了应对编译成功但发布固件前意外报错的情况，可以不再编译直接尝试后面的步骤。

run-name: Build - ${{ inputs.model }}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: diy_jdcloud_cs02_libwrt
        options:
          - diy_jdcloud_cs02_immwrt
          - diy_jdcloud_cs02_libwrt
          - aliyun_ap8220_immwrt
          - aliyun_ap8220_libwrt
          - cmcc_rax3000m_immwrt
          - gemtek_w1701k_immwrt
          - jdcloud_ax6000_immwrt
          - jdcloud_ipq60xx_immwrt
          - jdcloud_ipq60xx_libwrt
          - link_nn6000v2_immwrt
          - linksys_mx4x00_immwrt
          - n1_immwrt
          - qihoo_360v6_immwrt
          - redmi_ax5_immwrt
          - redmi_ax6_immwrt
          - redmi_ax6_libwrt
          - redmi_ax6000_immwrt21
          - zn_m2_immwrt
          - zn_m2_libwrt
          - x64_immwrt

      add_fragments:
        required: false
        description: Add config fragments, comma separated
        default: ""

      remove_fragments:
        required: false
        description: Remove default config fragments, comma separated
        default: ""

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          docker system prune -af || true
          sudo -E apt-get autoremove --purge -y || true
          sudo -E apt-get clean || true
          df -hT

      - name: Build System Setup
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix
          sudo -E apt -yqq install libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set Build Date and Timezone
        env:
          RAW_ADD_CONFIG_FRAGMENTS: ${{ inputs.add_fragments }}
          RAW_REMOVE_CONFIG_FRAGMENTS: ${{ inputs.remove_fragments }}
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"

          sanitize_cache_key_part() {
            printf '%s' "$1" | tr -c 'A-Za-z0-9_.-' '_'
          }

          echo "ADD_CONFIG_FRAGMENTS_KEY=$(sanitize_cache_key_part "$RAW_ADD_CONFIG_FRAGMENTS")" >> "$GITHUB_ENV"
          echo "REMOVE_CONFIG_FRAGMENTS_KEY=$(sanitize_cache_key_part "$RAW_REMOVE_CONFIG_FRAGMENTS")" >> "$GITHUB_ENV"

          export BUILD_SRC=$(awk -F"=" '/REPO_URL/ {print $NF}' "./wrt_core/compilecfg/${{ inputs.model }}.ini")
          echo "BUILD_SRC=$BUILD_SRC" >> "$GITHUB_ENV"

      - name: Pre Clone
        run: |
          ./wrt_core/pre_clone_action.sh ${{ inputs.model }}

      - name: Calculate Repo Flag Hash
        run: |
          echo "Calculating repo_flag hash..."

          REPO_FLAG_HASH="none"

          if find . -type f -name "repo_flag" -print -quit | grep -q .; then
            REPO_FLAG_HASH=$(
              find . -type f -name "repo_flag" -print0 |
              sort -z |
              xargs -0 sha256sum |
              sha256sum |
              awk '{print $1}'
            )
          fi

          echo "REPO_FLAG_HASH=$REPO_FLAG_HASH" >> "$GITHUB_ENV"

          echo "REPO_FLAG_HASH=$REPO_FLAG_HASH"

      - name: Cache Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ runner.os }}-${{ inputs.model }}-${{ env.REPO_FLAG_HASH }}-${{ env.ADD_CONFIG_FRAGMENTS_KEY }}-${{ env.REMOVE_CONFIG_FRAGMENTS_KEY }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.model }}-${{ env.REPO_FLAG_HASH }}-${{ env.ADD_CONFIG_FRAGMENTS_KEY }}-${{ env.REMOVE_CONFIG_FRAGMENTS_KEY }}-
            ${{ runner.os }}-${{ inputs.model }}-${{ env.REPO_FLAG_HASH }}-

      - name: Refresh the cache
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" \
              -type d \
              -name "stamp" \
              -not -path "*target*" |
            while read -r dir; do
              find "$dir" -type f -exec touch {} +
            done
          fi

      - name: Machine Information (Pre-build)
        run: |
          echo "=============== Pre-build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Kernel: $(uname -r)"
          echo "Uptime: $(uptime -p)"
          echo "=================================================="

          echo "[CPU]"
          lscpu | grep -E "Model name|Architecture|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|CPU max MHz" || true

          echo "=================================================="
          echo "[Memory]"
          free -h

          echo "=================================================="
          echo "[Disk]"
          df -hT

          echo "--------------------------------------------------"
          df -hi

          echo "=================================================="
          echo "[Workspace]"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"

          du -sh "${GITHUB_WORKSPACE}" 2>/dev/null || true
          du -sh ./action_build/.ccache 2>/dev/null || true
          du -sh ./action_build/staging_dir 2>/dev/null || true
          du -sh ./firmware 2>/dev/null || true

          echo "=================================================="

      - name: Build Firmware
        env:
          ADD_CONFIG_FRAGMENTS: ${{ inputs.add_fragments }}
          REMOVE_CONFIG_FRAGMENTS: ${{ inputs.remove_fragments }}
        run: |
          ./build.sh ${{ inputs.model }}

      - name: Get Kernel Version
        run: |
          MANIFEST=$(find ./firmware -maxdepth 1 -type f -name "*.manifest" | head -n 1)

          if [ -n "$MANIFEST" ]; then
            KVER=$(grep -oP "^kernel\.\*" "$MANIFEST" |
              grep -oP "[4-6]\.[0-9]{1,3}\.[0-9]{1,3}" |
              head -n 1 || true)
          fi

          KVER=${KVER:-unknown}

          echo "KVER=$KVER" >> "$GITHUB_ENV"

          echo "Kernel version: $KVER"

      - name: Machine Information (Post-build)
        run: |
          echo "=============== Post-build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Kernel: $(uname -r)"
          echo "Uptime: $(uptime -p)"
          echo "===================================================="

          echo "[CPU]"
          lscpu | grep -E "Model name|Architecture|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|CPU max MHz" || true

          echo "===================================================="
          echo "[Memory]"
          free -h

          echo "===================================================="
          echo "[Disk]"
          df -hT

          echo "----------------------------------------------------"
          df -hi

          echo "===================================================="
          echo "[Build Outputs]"

          du -sh ./action_build/.ccache 2>/dev/null || true
          du -sh ./action_build/staging_dir 2>/dev/null || true
          du -sh ./firmware 2>/dev/null || true

          echo "Firmware file count: $(find ./firmware -maxdepth 1 -type f | wc -l)"

          echo "===================================================="

      - name: Prepare Build Artifact
        run: |
          set -e

          rm -rf ./release_artifact

          mkdir -p ./release_artifact/firmware
          mkdir -p ./release_artifact/kmods
          mkdir -p ./release_artifact/metadata

          echo "Copying firmware..."

          if [ ! -d "./firmware" ]; then
            echo "ERROR: ./firmware does not exist."
            exit 1
          fi

          cp -a ./firmware/. ./release_artifact/firmware/

          echo "Copying kmod packages..."

          if [ -d "./action_build/bin" ]; then
            find ./action_build/bin \
              -type f \
              \( -name "kmod*.ipk" -o -name "kmod*.apk" \) \
              -exec cp --parents {} ./release_artifact/kmods/ \;
          fi

          cat > ./release_artifact/metadata/build-info.env <<EOF
          MODEL=${{ inputs.model }}
          BUILD_DATE=${BUILD_DATE}
          BUILD_SRC=${BUILD_SRC}
          KVER=${KVER}
          REPO_FLAG_HASH=${REPO_FLAG_HASH}
          BUILD_RUN_ID=${{ github.run_id }}
          BUILD_RUN_NUMBER=${{ github.run_number }}
          ADD_CONFIG_FRAGMENTS=${{ inputs.add_fragments }}
          REMOVE_CONFIG_FRAGMENTS=${{ inputs.remove_fragments }}
          EOF

          echo "================ Artifact Contents ================"

          find ./release_artifact -type f | sort

          echo "===================================================="

          echo "Firmware size:"
          du -sh ./release_artifact/firmware || true

          echo "Kmods size:"
          du -sh ./release_artifact/kmods || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wrt-build-${{ github.run_id }}
          path: ./release_artifact
          if-no-files-found: error
          retention-days: 30
          compression-level: 1

      - name: Build Summary
        run: |
          {
            echo "## OpenWrt Build Completed"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Model | \`${{ inputs.model }}\` |"
            echo "| Build Date | \`${BUILD_DATE}\` |"
            echo "| Kernel | \`${KVER}\` |"
            echo "| Build Run ID | \`${{ github.run_id }}\` |"
            echo "| Source | \`${BUILD_SRC}\` |"
            echo "| Artifact | \`wrt-build-${{ github.run_id }}\` |"
            echo
            echo "The firmware has been saved as a GitHub Actions Artifact."
          } >> "$GITHUB_STEP_SUMMARY"
