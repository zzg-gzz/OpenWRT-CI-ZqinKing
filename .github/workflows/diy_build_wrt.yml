# Code by ChatGPT  本工作流编译固件并Upload Build Artifact，如果本工作流编译成功可以继续执行发布固件的工作流。
# 拆分是为了应对编译成功但发布固件前意外报错的情况，可以不再编译直接尝试后面的步骤。

name: DIY Build WRT

run-name: Build - ${{ inputs.model }}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: diy_jdcloud_cs02_libwrt
        options:
          - diy_jdcloud_cs02_immwrt
          - diy_jdcloud_cs02_libwrt
          - aliyun_ap8220_immwrt
          - aliyun_ap8220_libwrt
          - cmcc_rax3000m_immwrt
          - gemtek_w1701k_immwrt
          - jdcloud_ax6000_immwrt
          - jdcloud_ipq60xx_immwrt
          - jdcloud_ipq60xx_libwrt
          - link_nn6000v2_immwrt
          - linksys_mx4x00_immwrt
          - n1_immwrt
          - qihoo_360v6_immwrt
          - redmi_ax5_immwrt
          - redmi_ax6_immwrt
          - redmi_ax6_libwrt
          - redmi_ax6000_immwrt21
          - zn_m2_immwrt
          - zn_m2_libwrt
          - x64_immwrt

      add_fragments:
        required: false
        description: Add config fragments, comma separated
        default: ""

      remove_fragments:
        required: false
        description: Remove default config fragments, comma separated
        default: ""

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          docker system prune -af || true
          sudo -E apt-get autoremove --purge -y || true
          sudo -E apt-get clean || true
          df -hT

      - name: Build System Setup
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix
          sudo -E apt -yqq install libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set Build Date and Timezone
        env:
          RAW_ADD_CONFIG_FRAGMENTS: ${{ inputs.add_fragments }}
          RAW_REMOVE_CONFIG_FRAGMENTS: ${{ inputs.remove_fragments }}
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"

          sanitize_cache_key_part() {
            printf '%s' "$1" | tr -c 'A-Za-z0-9_.-' '_'
          }

          echo "ADD_CONFIG_FRAGMENTS_KEY=$(sanitize_cache_key_part "$RAW_ADD_CONFIG_FRAGMENTS")" >> "$GITHUB_ENV"
          echo "REMOVE_CONFIG_FRAGMENTS_KEY=$(sanitize_cache_key_part "$RAW_REMOVE_CONFIG_FRAGMENTS")" >> "$GITHUB_ENV"

          export BUILD_SRC=$(awk -F"=" '/REPO_URL/ {print $NF}' "./wrt_core/compilecfg/${{ inputs.model }}.ini")
          echo "BUILD_SRC=$BUILD_SRC" >> "$GITHUB_ENV"

      - name: Pre Clone
        run: |
          ./wrt_core/pre_clone_action.sh ${{ inputs.model }}

      - name: Calculate Repo Flag Hash
        run: |
          echo "Calculating repo_flag hash..."

          REPO_FLAG_HASH="none"

          if find . -type f -name "repo_flag" -print -quit | grep -q .; then
            REPO_FLAG_HASH=$(
              find . -type f -name "repo_flag" -print0 |
              sort -z |
              xargs -0 sha256sum |
              sha256sum |
              awk '{print $1}'
            )
          fi

          echo "REPO_FLAG_HASH=$REPO_FLAG_HASH" >> "$GITHUB_ENV"

          echo "REPO_FLAG_HASH=$REPO_FLAG_HASH"

      - name: Cache Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ runner.os }}-${{ inputs.model }}-${{ env.REPO_FLAG_HASH }}-${{ env.ADD_CONFIG_FRAGMENTS_KEY }}-${{ env.REMOVE_CONFIG_FRAGMENTS_KEY }}-${{ env.BUILD_DATE }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.model }}-${{ env.REPO_FLAG_HASH }}-${{ env.ADD_CONFIG_FRAGMENTS_KEY }}-${{ env.REMOVE_CONFIG_FRAGMENTS_KEY }}-
            ${{ runner.os }}-${{ inputs.model }}-${{ env.REPO_FLAG_HASH }}-

      - name: Refresh the cache
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" \
              -type d \
              -name "stamp" \
              -not -path "*target*" |
            while read -r dir; do
              find "$dir" -type f -exec touch {} +
            done
          fi

      - name: Machine Information (Pre-build)
        run: |
          echo "=============== Pre-build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Kernel: $(uname -r)"
          echo "Uptime: $(uptime -p)"
          echo "=================================================="

          echo "[CPU]"
          lscpu | grep -E "Model name|Architecture|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|CPU max MHz" || true

          echo "=================================================="
          echo "[Memory]"
          free -h

          echo "=================================================="
          echo "[Disk]"
          df -hT

          echo "--------------------------------------------------"
          df -hi

          echo "=================================================="
          echo "[Workspace]"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"

          du -sh "${GITHUB_WORKSPACE}" 2>/dev/null || true
          du -sh ./action_build/.ccache 2>/dev/null || true
          du -sh ./action_build/staging_dir 2>/dev/null || true
          du -sh ./firmware 2>/dev/null || true

          echo "=================================================="

      - name: Build Firmware
        env:
          ADD_CONFIG_FRAGMENTS: ${{ inputs.add_fragments }}
          REMOVE_CONFIG_FRAGMENTS: ${{ inputs.remove_fragments }}
        run: |
          ./build.sh ${{ inputs.model }}

      # ==========================================================
      # 最关键的一步：
      # 编译成功后立即保存 firmware。
      # 后面的任何步骤失败，都不会影响这个 Artifact。
      # ==========================================================

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wrt-firmware-${{ github.run_id }}
          path: ./firmware
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Get Kernel Version
        run: |
          MANIFEST=$(find ./firmware \
            -maxdepth 1 \
            -type f \
            -name "*.manifest" |
            head -n 1)

          KVER="unknown"

          if [ -n "$MANIFEST" ]; then
            KVER=$(grep -oP "^kernel\.\*" "$MANIFEST" |
              grep -oP "[4-6]\.[0-9]{1,3}\.[0-9]{1,3}" |
              head -n 1 || true)
          fi

          echo "KVER=$KVER" >> "$GITHUB_ENV"

          echo "Kernel version: $KVER"

      - name: Machine Information (Post-build)
        run: |
          echo "=============== Post-build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Kernel: $(uname -r)"
          echo "Uptime: $(uptime -p)"
          echo "===================================================="

          echo "[CPU]"
          lscpu | grep -E "Model name|Architecture|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|CPU max MHz" || true

          echo "===================================================="
          echo "[Memory]"
          free -h

          echo "===================================================="
          echo "[Disk]"
          df -hT

          echo "----------------------------------------------------"
          df -hi

          echo "===================================================="
          echo "[Build Outputs]"

          du -sh ./action_build/.ccache 2>/dev/null || true
          du -sh ./action_build/staging_dir 2>/dev/null || true
          du -sh ./firmware 2>/dev/null || true

          echo "Firmware file count: $(find ./firmware -maxdepth 1 -type f | wc -l)"

          echo "===================================================="

      - name: Package Kmods
        run: |
          set -e

          if [ ! -d "./action_build/bin" ]; then
            echo "kmod source directory not found: ./action_build/bin" >&2
            exit 1
          fi

          KMOD_LIST=$(mktemp)
          trap 'rm -f "$KMOD_LIST"' EXIT

          (
            cd ./action_build/bin

            find . -type f \
              \( -name "kmod*.ipk" -o -name "kmod*.apk" \) \
              -print |
              sort > "$KMOD_LIST"
          )

          if [ ! -s "$KMOD_LIST" ]; then
            echo "No kmod packages found under ./action_build/bin" >&2
            exit 1
          fi

          KMOD_COUNT=$(wc -l < "$KMOD_LIST" | tr -d '[:space:]')

          ARCHIVE_NAME="kmods_${{ inputs.model }}_${KVER:-unknown-kernel}_${BUILD_DATE}.tar.gz"

          tar \
            -C ./action_build/bin \
            -czf "$ARCHIVE_NAME" \
            -T "$KMOD_LIST"

          echo "KMOD_ARCHIVE=$ARCHIVE_NAME" >> "$GITHUB_ENV"

          echo "Packaged $KMOD_COUNT kmod packages into $ARCHIVE_NAME"

      - name: Package OpenWrt Firmware
        if: ${{ inputs.model == 'n1_immwrt' }}
        uses: unifreq/openwrt_packit@8007d3efd49bb42aa20c5755a50af21dc7a438e1
        env:
          OPENWRT_ARMVIRT: firmware/*.tar.gz
          PACKAGE_SOC: s905d
          KERNEL_VERSION_NAME: 6.6.y
          WHOAMI: ZqinKing

      - name: Prepare Release Body
        run: |
          echo "云编译发布" > release_body.txt
          echo "源码：${BUILD_SRC}" >> release_body.txt
          echo "Kernel: ${KVER}" >> release_body.txt
          echo "WIFI密码: 12345678" >> release_body.txt
          echo "LAN地址: 192.168.1.1" >> release_body.txt
          echo "KMOD归档: ${KMOD_ARCHIVE:-未生成}" >> release_body.txt
          echo "插件：" >> release_body.txt

          MANIFEST=$(find ./firmware \
            -maxdepth 1 \
            -type f \
            -name "*.manifest" |
            head -n 1)

          if [ -n "$MANIFEST" ]; then
            grep -oP "luci-app(-[a-zA-Z0-9]{1,}){1,}" "$MANIFEST" |
              awk -F":" '{print $NF}' >> release_body.txt || true
          fi

      - name: Upload Build Metadata
        if: ${{ success() }}
        run: |
          mkdir -p ./build_metadata

          cat > ./build_metadata/build-info.env <<EOF
          MODEL=${{ inputs.model }}
          BUILD_DATE=${BUILD_DATE}
          BUILD_SRC=${BUILD_SRC}
          KVER=${KVER:-unknown}
          REPO_FLAG_HASH=${REPO_FLAG_HASH}
          BUILD_RUN_ID=${{ github.run_id }}
          BUILD_RUN_NUMBER=${{ github.run_number }}
          ADD_CONFIG_FRAGMENTS=${{ inputs.add_fragments }}
          REMOVE_CONFIG_FRAGMENTS=${{ inputs.remove_fragments }}
          EOF

          cp release_body.txt ./build_metadata/release_body.txt

      - name: Upload Build Metadata Artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wrt-metadata-${{ github.run_id }}
          path: ./build_metadata
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Build Summary
        run: |
          {
            echo "## OpenWrt Build Completed"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Model | \`${{ inputs.model }}\` |"
            echo "| Build Date | \`${BUILD_DATE}\` |"
            echo "| Kernel | \`${KVER:-unknown}\` |"
            echo "| Build Run ID | \`${{ github.run_id }}\` |"
            echo "| Source | \`${BUILD_SRC}\` |"
            echo "| Firmware Artifact | \`wrt-firmware-${{ github.run_id }}\` |"
            echo
            echo "Firmware has been saved as an Artifact."
          } >> "$GITHUB_STEP_SUMMARY"
